services:
  proyecto-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proyecto-api
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Indicador de que estamos en Docker
      - DOCKER_ENV=true
      
      # Configuración de la base de datos PostgreSQL
      - PGHOST=${PGHOST}
      - PGDATABASE=${PGDATABASE}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      
      # Configuración de Spring Boot para PostgreSQL
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${PGHOST}:5432/${PGDATABASE}
      - SPRING_DATASOURCE_USERNAME=${PGUSER}
      - SPRING_DATASOURCE_PASSWORD=${PGPASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      
      # Configuración de Hibernate/JPA
      - PSA_JPA_HIBERNATE_DDL_AUTO=${PSA_JPA_HIBERNATE_DDL_AUTO:-update}
      - PSA_JPA_SHOW_SQL=${PSA_JPA_SHOW_SQL:-true}
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      
      # Configuración de Flyway
      - PSA_FLYWAY_ENABLED=${PSA_FLYWAY_ENABLED:-true}
      
      # Configuración de servidor
      - SERVER_PORT=8080
      
      # URLs de las APIs externas
      - RECURSOS_API_URL=${RECURSOS_API_URL:-}
      - CLIENTES_API_URL=${CLIENTES_API_URL:-}
      - SOPORTE_API_URL=${SOPORTE_API_URL:-}
    
    # Carga variables de entorno desde el archivo .env
    env_file:
      - .env
    
    # Configuración de Healthcheck adicional al Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:$${PORT:-8080}/swagger-ui/index.html || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      
    # Límites de recursos (Hardening)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
          
    # Reinicia automáticamente el contenedor si falla
    restart: unless-stopped
    
    # Red personalizada
    networks:
      - proyecto-network

networks:
  proyecto-network:
    driver: bridge